name: Release Fork Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install

      - name: Build all targets
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ github.ref_name }}
        run: |
          # Strip 'v' prefix from tag (v0.1.2-fork.1 → 0.1.2-fork.1)
          export OPENCODE_VERSION="${OPENCODE_VERSION#v}"
          bun run build

      - name: Create release archives
        working-directory: packages/opencode/dist
        run: |
          zip -r opencode-darwin-arm64.zip   opencode-darwin-arm64/bin/opencode
          zip -r opencode-darwin-x64.zip     opencode-darwin-x64/bin/opencode
          zip -r opencode-darwin-x64-baseline.zip opencode-darwin-x64-baseline/bin/opencode
          tar -czf opencode-linux-arm64.tar.gz      -C opencode-linux-arm64/bin opencode
          tar -czf opencode-linux-x64.tar.gz        -C opencode-linux-x64/bin opencode
          tar -czf opencode-linux-x64-baseline.tar.gz -C opencode-linux-x64-baseline/bin opencode
          tar -czf opencode-linux-arm64-musl.tar.gz   -C opencode-linux-arm64-musl/bin opencode
          tar -czf opencode-linux-x64-musl.tar.gz     -C opencode-linux-x64-musl/bin opencode

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/opencode/dist/opencode-darwin-arm64.zip
            packages/opencode/dist/opencode-darwin-x64.zip
            packages/opencode/dist/opencode-darwin-x64-baseline.zip
            packages/opencode/dist/opencode-linux-arm64.tar.gz
            packages/opencode/dist/opencode-linux-x64.tar.gz
            packages/opencode/dist/opencode-linux-x64-baseline.tar.gz
            packages/opencode/dist/opencode-linux-arm64-musl.tar.gz
            packages/opencode/dist/opencode-linux-x64-musl.tar.gz
          generate_release_notes: true

      - name: Set lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (to pull dhi.io/debian-base:bookworm)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: packages/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ github.ref_name }}
            ghcr.io/${{ env.REPO }}:latest
