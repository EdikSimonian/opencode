name: Rebuild Docker on base image update

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:      # Allow manual trigger too

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
      digest: ${{ steps.base.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get current base image digest
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect alpine:latest \
            --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Current digest: $DIGEST"

      - name: Compare to stored digest
        id: compare
        run: |
          STORED=$(cat .docker-base-digest 2>/dev/null || echo "none")
          echo "Stored digest:  $STORED"
          if [ "$STORED" = "${{ steps.base.outputs.digest }}" ]; then
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "Base image unchanged — skipping rebuild"
          else
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Base image changed — rebuild needed"
          fi

      - name: Get latest release tag
        id: tag
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest release: $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rebuild:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install

      - name: Build binaries
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.check.outputs.tag }}
        run: |
          export OPENCODE_VERSION="${OPENCODE_VERSION#v}"
          bun run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: packages/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ needs.check.outputs.tag }}
            ghcr.io/${{ env.REPO }}:latest

      - name: Store new digest and commit
        run: |
          echo "${{ needs.check.outputs.digest }}" > .docker-base-digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .docker-base-digest
          git commit -m "chore: update docker base image digest [skip ci]"
          git push
